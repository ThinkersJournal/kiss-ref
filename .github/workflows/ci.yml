name: CI

# Every gate that was previously run by hand. Six of them, ALL HARD:
#   1. `cargo test --workspace`                  — the conformance suite + unit tests
#   2. a *genuine* no_std build of kiss-ref-core against a bare-metal target
#   3. `cargo fmt --all --check`                 — formatting
#   4. `cargo clippy --workspace --all-targets`  — warnings denied
#   5. `cargo doc` with RUSTDOCFLAGS=-D warnings  — no broken/private intra-doc links
#   6. `cargo package --workspace`               — publish-readiness (now that we ship)
#
# All six FAIL the job. (3) and (4) were `continue-on-error` initially because the
# tree predated any fmt/clippy pass; the dedicated `cargo fmt --all` + clippy
# cleanup landed, so they are now hard gates like the rest. (5) and (6) were added
# once the crates were published to crates.io (v0.1.0/v0.2.0): a dead docs.rs link
# and a publish-breaking metadata regression are now real, so they gate too.
#
# (2) is the load-bearing one. kiss-ref-core is `#![cfg_attr(not(test), no_std)]`
# and Fuel consumes it relying on that property. A host build cannot prove it:
# `std` is always available to link against, so a leaked `std::` path or a dep
# that quietly enables its `std` feature can survive. `thumbv7em-none-eabi` has
# no `std` at all (rustup ships only core/alloc/compiler_builtins for it), so any
# leak — in kiss-ref-core, kiss-ops-vocab, kiss-classify-vocab, libm, or half —
# is a hard compile error here rather than a surprise in Fuel's tree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned to an exact version per the portfolio toolchain ruling (2026-08-21) —
  # never the moving `stable` alias, so a repo at rest cannot silently diverge from
  # whatever `stable` resolves to. Matches rust-toolchain.toml; bump deliberately.
  RUST_TOOLCHAIN: "1.98.0"
  # Bare-metal ARM Cortex-M4/M7: core + alloc only, `std` does not exist.
  NOSTD_TARGET: thumbv7em-none-eabi

jobs:
  gates:
    name: test / clippy / fmt / no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain and the bare-metal target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$NOSTD_TARGET"
          rustc -V
          cargo -V
          cargo clippy -V
          cargo fmt --version

      - name: Toolchain fingerprint (cache key input)
        id: rust
        run: echo "fp=$(rustc -V | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Cargo.lock is .gitignore'd in this repo, so the dependency set is keyed
          # off the manifests instead. The toolchain fingerprint is in the key so a
          # stable-channel bump does not reuse artifacts built by the old compiler.
          key: cargo-${{ runner.os }}-${{ steps.rust.outputs.fp }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ steps.rust.outputs.fp }}-
            cargo-${{ runner.os }}-

      # Each gate below runs even if an earlier one failed (`!cancelled()`), so one
      # push reports every broken gate at once instead of one per round trip. Any
      # failing step still fails the job.

      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check

      - name: no_std - build kiss-ref-core for thumbv7em-none-eabi
        if: ${{ !cancelled() }}
        # Builds an rlib, so no #[panic_handler] / #[global_allocator] is needed;
        # `-p` keeps the std-using kiss-ref-conformance crate (and any feature
        # unification with it) out of the graph. Deps built here: kiss-ops-vocab,
        # kiss-classify-vocab, libm (pure-Rust no_std), half (default-features off
        # in both manifests => no `std` feature). Nothing else in the tree.
        run: cargo build -p kiss-ref-core --target "$NOSTD_TARGET"

      - name: Clippy (warnings denied)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: Docs (broken intra-doc links denied)
        if: ${{ !cancelled() }}
        # A public item's doc that links to a PRIVATE item is a dead link in the
        # published (docs.rs) docs. `-D warnings` promotes rustdoc's
        # private-intra-doc-links (and every other doc lint) to a hard error.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Package (publish-readiness)
        if: ${{ !cancelled() }}
        # Verifies every crate still packages + builds in isolation from its tarball
        # — catches a path-dep missing a version, a leaked/absent file, or a metadata
        # regression BEFORE it breaks the next `cargo publish`, now that we ship
        # releases. (The workspace build/test gates cover the in-tree compile.)
        run: cargo package --workspace

  # A declared `rust-version` is a promise to consumers; unexercised, it is worse
  # than none (a consumer on the floor reads it as tested). This job builds under
  # EXACTLY the declared MSRV, read from the manifest so the promise and the gate
  # cannot drift. `stable`/pinned gates above run on the current toolchain; this
  # one runs on the floor.
  msrv:
    name: msrv (declared rust-version builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*\"([0-9.]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install the declared MSRV toolchain + bare-metal target
        run: |
          rustup toolchain install "${{ steps.msrv.outputs.v }}" --profile minimal
          rustup target add "$NOSTD_TARGET" --toolchain "${{ steps.msrv.outputs.v }}"
          rustc "+${{ steps.msrv.outputs.v }}" -V

      # BUILD, not test: the MSRV promise is that a consumer on this rustc can
      # COMPILE kiss-ref, not that its dev-only test suite runs. `+<version>` is
      # explicit so it overrides the repo's `rust-toolchain.toml` pin.
      - name: Build the whole workspace under the declared MSRV
        run: cargo "+${{ steps.msrv.outputs.v }}" build --workspace

      - name: no_std build of kiss-ref-core under the declared MSRV
        run: cargo "+${{ steps.msrv.outputs.v }}" build -p kiss-ref-core --target "$NOSTD_TARGET"
