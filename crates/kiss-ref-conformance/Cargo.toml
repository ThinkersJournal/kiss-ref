[package]
name         = "kiss-ref-conformance"
description  = "The build-time (atom × legal-dtype) coverage gate + the KISS-Conform-named conformance corpus for kiss-ref."
edition.workspace      = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
# Dev-only: the coverage gate + conformance corpus, never a released crate. The
# published unit is exactly kiss-classify-vocab, kiss-ops-vocab, kiss-ref-core.
# `publish = false` makes that UNCONSTRUCTIBLE rather than remembered — a
# `cargo publish --workspace` (or a stray publish) cannot push this to crates.io.
publish      = false

[dependencies]
kiss-classify-vocab = { workspace = true }
kiss-ops-vocab      = { workspace = true }
kiss-ref-core       = { workspace = true }
half                = { version = "2", default-features = false }
