[package]
name         = "kiss-ref-core"
description  = "The KISS base-op reference kernels: the floor atoms + the §6.13/§6.14 recursive-resolution engine. Spec-exact, obvious, slow."
edition.workspace      = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
kiss-classify-vocab = { workspace = true }
kiss-ops-vocab      = { workspace = true }
libm                = { workspace = true }
# no_std-compatible (default features off) — f16/bf16 storage + conversions.
half                = { version = "2", default-features = false }
